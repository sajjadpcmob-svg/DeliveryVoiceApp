name: Build Delivery Voice APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Download Persian offline model (Vosk)
        run: |
          set -e
          MODEL_URL="https://alphacephei.com/vosk/models/vosk-model-small-fa-0.5.zip"
          curl -L -o model.zip "$MODEL_URL"
          unzip -q model.zip -d model_tmp
          mkdir -p app/src/main/assets/model-fa
          INNER=$(ls -d model_tmp/*/ | head -n 1)
          cp -r "$INNER"* app/src/main/assets/model-fa/
          ls -la app/src/main/assets/model-fa/

      - name: Bundle JS libraries (offline, no CDN needed on phone)
        run: |
          set -e
          mkdir -p app/src/main/assets/lib
          curl -L -o app/src/main/assets/lib/supabase.min.js "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"
          curl -L -o app/src/main/assets/lib/xlsx.full.min.js "https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"
          ls -la app/src/main/assets/lib/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeliveryVoiceApp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
